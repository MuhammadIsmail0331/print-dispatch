<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="400" viewBox="0 0 1100 400" role="img" aria-labelledby="title desc">
<title id="title">Print Dispatch: a clear handoff before the first print</title><desc id="desc">A manifest supplies quantity and millimetres; digital checks produce a measured card and an exact-file ZIP.</desc>
<rect width="1100" height="400" fill="#f3f0e7"/><path d="M38 36H1062" stroke="#182d27" stroke-width="5"/>
<g fill="#182d27"><text x="38" y="76" font-family="Courier New,monospace" font-size="13" letter-spacing="3">PRINT DISPATCH / FIRST ARTICLE, THEN THE BATCH</text><text x="38" y="145" font-family="Georgia,serif" font-size="58">Make the handoff obvious.</text></g>
<g stroke="#c8cec2" fill="none"><rect x="38" y="188" width="300" height="145" rx="3"/><rect x="400" y="188" width="300" height="145" rx="3"/><rect x="762" y="188" width="300" height="145" rx="3"/></g>
<g font-family="Courier New,monospace" fill="#182d27"><g fill="#cb593b" font-size="14"><text x="56" y="217">01 / DECLARE</text><text x="418" y="217">02 / CHECK</text><text x="780" y="217">03 / DISPATCH</text></g><g font-size="18"><text x="56" y="253">3 pieces. 2 files.</text><text x="418" y="253">Size. Edges. Hashes.</text><text x="780" y="253">One precise package.</text></g><g font-size="13"><text x="56" y="292">mm / material / orientation</text><text x="418" y="292">No hidden scale conversion</text><text x="780" y="292">STLs + manifest + job card</text></g></g>
<g stroke="#cb593b" stroke-width="2" fill="none"><path d="M352 260h32m-8-7 8 7-8 7M714 260h32m-8-7 8 7-8 7"/></g><text x="38" y="371" font-family="Courier New,monospace" font-size="13" fill="#35594a">Python 3.10+ · zero dependencies · offline · integrity checks, not a design certificate</text></svg>
